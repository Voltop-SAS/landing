name: CI/CD to GKE

on:
  push:
    branches: [ production, staging ]
  pull_request:
    branches: [ staging, production ]

env:
  REPOSITORY_NAME_STG: repo-stg-landing-api-grinest
  REPOSITORY_NAME_PRD: repo-prd-landing-api-grinest
  GAR_LOCATION: us-central1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---- AUTH GCP ----
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_LANDING }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ---- DOCKER LOGIN ----
      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # ===== BUILD STAGING =====
      - name: Build & Push to Artifact Registry (STG)
        if: |
          github.ref == 'refs/heads/staging' ||
          github.event.pull_request.base.ref == 'staging'
        env:
          TAG: stg-${{ github.sha }}
          ENV: ${{ secrets.ENV_STG }}
          POSTGRES_DB_URL: ${{ secrets.POSTGRES_DB_URL_STG }}
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME_STG }}/voltop-landing"
          SHORT="${TAG:0:11}"
          docker build \
            --build-arg ENV="$ENV" \
            --build-arg POSTGRES_DB_URL="$POSTGRES_DB_URL" \
            -t "$IMAGE:$SHORT" .
          docker push "$IMAGE:$SHORT"

      # ===== BUILD PRODUCTION =====
      - name: Build & Push to Artifact Registry (PRD)
        if: |
          github.ref == 'refs/heads/production' ||
          github.event.pull_request.base.ref == 'production'
        env:
          TAG: prd-${{ github.sha }}
          ENV: ${{ secrets.ENV_PRD }}
          POSTGRES_DB_URL: ${{ secrets.POSTGRES_DB_URL_PRD }}
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME_PRD }}/voltop-landing"
          SHORT="${TAG:0:11}"
          docker build \
            --build-arg ENV="$ENV" \
            --build-arg POSTGRES_DB_URL="$POSTGRES_DB_URL" \
            -t "$IMAGE:$SHORT" .
          docker push "$IMAGE:$SHORT"

  deploy:
    name: Update kustomize repo
    runs-on: ubuntu-latest
    needs: build

    env:
      GITHUB_TOKEN: ${{ secrets.VOLTOP_GITHUB_PAT }}
      REPO: ${{ secrets.VOLTOP_GITHUB_ACCOUNT }}/k8s-manifest
      REPO_DIR: voltop-landing

    steps:
      - name: Checkout Manifests Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          path: ${{ env.REPO_DIR }}
          token: ${{ env.GITHUB_TOKEN }}

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v1
        with:
          kustomize-version: '3.8.7'

      # ===== UPDATE STAGING =====
      - name: Update Image STG
        if: |
          github.ref == 'refs/heads/staging' ||
          github.event.pull_request.base.ref == 'staging'
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME_STG }}/voltop-landing"
          TAG="stg-${GITHUB_SHA:0:7}"
          cd "${{ env.REPO_DIR }}/${{ env.REPO_DIR }}/overlays/stg"
          kustomize edit set image "${IMAGE}=${IMAGE}:${TAG}"

      # ===== UPDATE PRD =====
      - name: Update Image PRD
        if: |
          github.ref == 'refs/heads/production' ||
          github.event.pull_request.base.ref == 'production'
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME_PRD }}/voltop-landing"
          TAG="prd-${GITHUB_SHA:0:7}"
          cd "${{ env.REPO_DIR }}/${{ env.REPO_DIR }}/overlays/prd"
          kustomize edit set image "${IMAGE}=${IMAGE}:${TAG}"

      - name: Commit & Push
        run: |
          cd "${{ env.REPO_DIR }}"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git commit -m "Update image $(date +'%Y-%m-%d %H:%M') from ${GITHUB_SHA}" || echo "No changes"
          git push