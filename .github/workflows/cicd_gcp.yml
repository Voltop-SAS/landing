name: CI/CD to GKE

on:
  push:
    branches: [production, staging]

env:
  GAR_LOCATION: us-central1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  PROJECT_NAME: landing

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      environment: ${{ steps.meta.outputs.environment }}
      repository_name: ${{ steps.meta.outputs.repository_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # El ambiente sale de la rama, no de un `env` fijo: `production` despliega
      # a prd y `staging` a stg. Todo lo demas (repositorio de Artifact Registry,
      # tag y overlay de kustomize) se deriva de ahi, para que el ambiente se
      # decida en un solo sitio y no en cinco pasos condicionales.
      #
      # El nombre del repositorio sigue el estandar del scaffold de Terraform
      # (gcp-infra/projects/landing): repo-<env>-landing-<naming_prefix>. Los
      # nombres anteriores (repo-<env>-landing-api-grinest) apuntaban al proyecto
      # GCP `grinest-app`, que ya no es donde vive este despliegue.
      - name: Compute environment and image tag
        id: meta
        run: |
          case "$GITHUB_REF" in
            refs/heads/production) ENVIRONMENT=prd ;;
            *)                     ENVIRONMENT=stg ;;
          esac
          {
            echo "environment=${ENVIRONMENT}"
            echo "repository_name=repo-${ENVIRONMENT}-landing-voltop"
            echo "tag=${ENVIRONMENT}-${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"
          echo "Ambiente: ${ENVIRONMENT} (ref ${GITHUB_REF})"

      # ---- AUTH GCP (clave JSON de Service Account, sin WIF) ----
      # Hay una SA por ambiente (`gh-actions-landing-stg` / `gh-actions-landing-prd`),
      # cada una con permiso de escritura UNICAMENTE sobre su repositorio de
      # Artifact Registry. `secrets` no admite indexacion dinamica, asi que la
      # seleccion va en una expresion sobre el ref y no sobre el output de `meta`.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ github.ref == 'refs/heads/production' && secrets.GCP_SA_KEY_LANDING_PRD || secrets.GCP_SA_KEY_LANDING_STG }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # ---- Build & Push ----
      # La landing no lee ninguna variable de entorno en tiempo de ejecucion (no
      # hay un solo `process.env` en `src/`), asi que aqui no se hornea ningun
      # secreto. `ENV` se pasa porque el Dockerfile lo declara como ARG; el
      # `--build-arg POSTGRES_DB_URL` anterior no correspondia a ningun ARG del
      # Dockerfile y Docker lo descartaba con un warning.
      - name: Build & Push to Artifact Registry
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ steps.meta.outputs.repository_name }}/${{ env.PROJECT_NAME }}"
          TAG="${{ steps.meta.outputs.tag }}"
          docker build \
            --build-arg ENV="${{ steps.meta.outputs.environment }}" \
            -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

  deploy:
    name: Update kustomize repo (GitOps)
    runs-on: ubuntu-latest
    needs: build

    env:
      GITHUB_TOKEN: ${{ secrets.VOLTOP_GITHUB_PAT }}
      REPO: Voltop-SAS/k8s-manifest
      REPO_DIR: k8s-manifest

    steps:
      - name: Checkout Manifests Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          path: ${{ env.REPO_DIR }}
          token: ${{ env.GITHUB_TOKEN }}

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v1
        with:
          kustomize-version: "5.8.0"

      - name: Update Image
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ needs.build.outputs.repository_name }}/${{ env.PROJECT_NAME }}"
          TAG="${{ needs.build.outputs.tag }}"
          cd "${{ env.REPO_DIR }}/${{ env.PROJECT_NAME }}/overlays/${{ needs.build.outputs.environment }}"
          kustomize edit set image "${{ env.PROJECT_NAME }}=${IMAGE}:${TAG}"

      - name: Commit & Push
        run: |
          cd "${{ env.REPO_DIR }}"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git commit -m "Update ${{ env.PROJECT_NAME }} ${{ needs.build.outputs.environment }} image $(date +'%Y-%m-%d %H:%M') from ${GITHUB_SHA}" || echo "No changes"
          git push
