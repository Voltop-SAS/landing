name: CI/CD to GKE

on:
  push:
    branches: [production, staging]

env:
  GAR_LOCATION: us-central1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  PROJECT_NAME: landing

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      environment: ${{ steps.meta.outputs.environment }}
      repository_name: ${{ steps.meta.outputs.repository_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # El ambiente sale de la rama, no de un `env` fijo: `production` despliega
      # a prd y `staging` a stg. Todo lo demas (repositorio de Artifact Registry,
      # tag y overlay de kustomize) se deriva de ahi, para que el ambiente se
      # decida en un solo sitio y no en cinco pasos condicionales.
      #
      # El nombre del repositorio sigue el estandar del scaffold de Terraform
      # (gcp-infra/projects/landing): repo-<env>-landing-<naming_prefix>. Los
      # nombres anteriores (repo-<env>-landing-api-grinest) apuntaban al proyecto
      # GCP `grinest-app`, que ya no es donde vive este despliegue.
      - name: Compute environment and image tag
        id: meta
        run: |
          case "$GITHUB_REF" in
            refs/heads/production) ENVIRONMENT=prd ;;
            *)                     ENVIRONMENT=stg ;;
          esac
          {
            echo "environment=${ENVIRONMENT}"
            echo "repository_name=repo-${ENVIRONMENT}-landing-voltop"
            echo "tag=${ENVIRONMENT}-${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"
          echo "Ambiente: ${ENVIRONMENT} (ref ${GITHUB_REF})"

      # ---- Secretos desde Doppler (clave JSON de la SA) ----
      # El token elige el config de Doppler y con el la SA, asi que la variable
      # se llama igual (`GCP_SA_KEY_LANDING`) en las configs `stg` y `prd`: el
      # workflow no necesita ningun condicional por rama para leerla.
      #
      # La seleccion del token si va en una expresion sobre el ref, porque
      # `secrets` no admite indexacion dinamica y por tanto no puede depender
      # del output de `meta`.
      - name: Fetch secrets from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@v1.3.0
        with:
          doppler-token: ${{ github.ref == 'refs/heads/production' && secrets.CI_DOPPLER_TOKEN_PRD || secrets.CI_DOPPLER_TOKEN_STG }}

      # ---- AUTH GCP (clave JSON de Service Account, sin WIF) ----
      # Hay una SA por ambiente (`gh-actions-landing-stg` / `gh-actions-landing-prd`),
      # cada una con permiso de escritura UNICAMENTE sobre su repositorio de
      # Artifact Registry.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ steps.doppler.outputs.GCP_SA_KEY_LANDING }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # ---- Build & Push ----
      # `ENV` is passed because the Dockerfile declares it as an ARG. The former
      # `--build-arg POSTGRES_DB_URL` matched no ARG at all and Docker dropped it
      # with a warning.
      #
      # THIS STEP BAKES SECRETS INTO THE IMAGE. Until the lead form was wired to
      # Amazon SES the landing read no environment variable at runtime, and the
      # comment here said exactly that. It no longer holds: the credentials are
      # passed as build args and the runner stage turns them into ENV, so whoever
      # can pull the image can read them back. Keeping them out of the image
      # would mean a Kubernetes Secret in the manifests repo; this route was
      # chosen deliberately. It is also why the SES pair being scoped to SES
      # alone matters: what leaks with the image can send mail and nothing else.
      #
      # THE SECRETS COME FROM TWO PLACES, and it is worth knowing which is which.
      #
      # · The SES KEYS come from GITHUB secrets, where the environment lives in
      #   the NAME because GitHub keeps one flat namespace with no config per
      #   environment. `secrets` does not admit dynamic indexing, so they cannot
      #   depend on the output of `meta` and are picked with an expression on the
      #   ref — the same reason the Doppler token above is chosen that way.
      #
      #   ONLY THE `_PRD` PAIR EXISTS. There is no `..._SES_STG`, and this is
      #   written as an explicit empty string rather than a reference to a secret
      #   that is not there, so that the gap reads as a decision instead of an
      #   oversight. The consequence, and it is intended: STAGING CANNOT SEND.
      #   Its lead form reports the failure honestly instead of pretending, which
      #   is the right trade — the alternative, reusing the production pair, mails
      #   the three commercial addresses every time somebody tests the form.
      #
      # · THE REGION comes from `AWS_REGION_PRD`, and note it carries no `_SES`
      #   in its name — it is the region of the account, not of the credential
      #   pair. Like them it exists only for production, and like them staging
      #   gets an explicit empty string. That is safe here: the code falls back
      #   to the region recorded in `leadDelivery.ts`, so an unset variable
      #   degrades to the right region rather than to a blank one.
      #
      # · GOOGLE_SERVICE_ACCOUNT_KEY still comes from DOPPLER, where the token
      #   picks the config and the name is therefore identical in `stg` and
      #   `prd`. So does `GCP_SA_KEY_LANDING` in the auth step above.
      #
      # They all travel through `env:` rather than being interpolated into the
      # script, so that a secret containing shell metacharacters cannot alter the
      # command.
      - name: Build & Push to Artifact Registry
        env:
          AWS_ACCESS_KEY_ID_SES: ${{ github.ref == 'refs/heads/production' && secrets.AWS_ACCESS_KEY_ID_SES_PRD || '' }}
          AWS_SECRET_ACCESS_KEY_SES: ${{ github.ref == 'refs/heads/production' && secrets.AWS_SECRET_ACCESS_KEY_SES_PRD || '' }}
          AWS_REGION: ${{ github.ref == 'refs/heads/production' && secrets.AWS_REGION_PRD || '' }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ steps.doppler.outputs.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ steps.meta.outputs.repository_name }}/${{ env.PROJECT_NAME }}"
          TAG="${{ steps.meta.outputs.tag }}"
          docker build \
            --target runner \
            --build-arg ENV="${{ steps.meta.outputs.environment }}" \
            --build-arg AWS_ACCESS_KEY_ID_SES="$AWS_ACCESS_KEY_ID_SES" \
            --build-arg AWS_SECRET_ACCESS_KEY_SES="$AWS_SECRET_ACCESS_KEY_SES" \
            --build-arg AWS_REGION="$AWS_REGION" \
            --build-arg GOOGLE_SERVICE_ACCOUNT_KEY="$GOOGLE_SERVICE_ACCOUNT_KEY" \
            -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

  deploy:
    name: Update kustomize repo (GitOps)
    runs-on: ubuntu-latest
    needs: build

    env:
      GITHUB_TOKEN: ${{ secrets.VOLTOP_GITHUB_PAT }}
      REPO: Voltop-SAS/k8s-manifest
      REPO_DIR: k8s-manifest

    steps:
      - name: Checkout Manifests Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          path: ${{ env.REPO_DIR }}
          token: ${{ env.GITHUB_TOKEN }}

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v1
        with:
          kustomize-version: "5.8.0"

      - name: Update Image
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ needs.build.outputs.repository_name }}/${{ env.PROJECT_NAME }}"
          TAG="${{ needs.build.outputs.tag }}"
          cd "${{ env.REPO_DIR }}/${{ env.PROJECT_NAME }}/overlays/${{ needs.build.outputs.environment }}"
          kustomize edit set image "${{ env.PROJECT_NAME }}=${IMAGE}:${TAG}"

      - name: Commit & Push
        run: |
          cd "${{ env.REPO_DIR }}"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git commit -m "Update ${{ env.PROJECT_NAME }} ${{ needs.build.outputs.environment }} image $(date +'%Y-%m-%d %H:%M') from ${GITHUB_SHA}" || echo "No changes"
          git push
